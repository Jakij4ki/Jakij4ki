  <text x="88" y="188" fill="#bdb7cc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" letter-spacing="3">DATA SCIENCE  •  MACHINE LEARNING  •  DATA ENGINEERING</text>
  <rect x="88" y="222" width="520" height="2" fill="url(#accent)"/>
